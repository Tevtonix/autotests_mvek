[pytest]
addopts = --alluredir=allure-results --clean-alluredir -v -s
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: быстрые дымовые проверки
    positive: позитивные сценарии
    negative: негативные сценарии валидации
    security: проверки информационной безопасности
    metrics: сценарии с замером производительности